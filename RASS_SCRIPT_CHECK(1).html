<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RASS Script Check</title><style>body{background:#0e1116;color:#eff9f7;font:16px system-ui;padding:22px;line-height:1.6}h1{color:#00c2a8}pre{white-space:pre-wrap;background:#182830;padding:16px;border-radius:12px}button{background:#00c2a8;color:#071310;padding:14px;border:0;border-radius:8px;font-weight:bold}</style></head><body><h1>RASS! Script Check</h1><p>No login needed. This page checks whether the JavaScript libraries required by Team HQ load on your phone.</p><pre id="results">Checking…</pre><button id="retry">Run check again</button><script>
(function(){'use strict';var out=document.getElementById('results');var lines=[];function add(s){lines.push(s);out.textContent=lines.join('\n')}window.addEventListener('error',function(e){add('Browser script error: '+(e.message||'Unknown error'))});window.addEventListener('unhandledrejection',function(e){add('Async error: '+String(e.reason?.message||e.reason))});function check(){lines=[];add('Inline JavaScript: WORKING');add('Supabase library: '+(window.supabase?.createClient?'LOADED':'NOT LOADED'));add('Map library: '+(window.L?.map?'LOADED':'NOT LOADED'));add('No password or account data collected.')}document.getElementById('retry').addEventListener('click',check);var scripts=[['Supabase','https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js'],['Leaflet','https://unpkg.com/leaflet@1.9.4/dist/leaflet.js']];check();scripts.forEach(function(item){var s=document.createElement('script');s.src=item[1];s.onload=function(){add(item[0]+' download: SUCCESS');check()};s.onerror=function(){add(item[0]+' download: FAILED (network/CDN/browser blocking)')};document.head.appendChild(s)});setTimeout(function(){add('Final check after 5 seconds:');check()},5000)})();
</script></body></html>
