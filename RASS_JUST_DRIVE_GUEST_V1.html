*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Arial,sans-serif;background:#07191b;color:#f5fffd}#map{position:fixed;inset:0;z-index:0}.leaflet-control-attribution{font-size:9px!important}.top{position:fixed;z-index:500;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 12px) 15px 13px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(#07191cf2,#07191ce8 75%,transparent);pointer-events:none}.logo{font-weight:1000;font-style:italic;font-size:32px;letter-spacing:-1.8px;text-shadow:0 2px 6px #0008}.logo span{color:#46ead0}.controls{display:flex;gap:9px}.round{pointer-events:auto;border:1px solid #ffffff55;background:#0a2425e8;color:white;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;box-shadow:0 3px 14px #0005;cursor:pointer}.round svg{width:23px;height:23px}.round[aria-pressed=false]{opacity:.7}.locate{position:fixed;right:15px;bottom:calc(env(safe-area-inset-bottom) + 150px);z-index:500}.report-wrap{position:fixed;z-index:510;bottom:calc(env(safe-area-inset-bottom) + 22px);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:5px}.rass{width:108px;height:103px;border:0;background:none;cursor:pointer;position:relative;filter:drop-shadow(0 7px 10px #0009);touch-action:manipulation}.crater{position:absolute;bottom:6px;left:8px;width:92px;height:41px;border-radius:50%;background:radial-gradient(ellipse at 50% 47%,#071214 0 37%,#21434a 40%,#4c757b 55%,#10292d 70%,#061316 75%);border:3px solid #8eafb0;box-shadow:inset 0 6px 12px #000,0 4px 0 #0a2225}.bang{position:absolute;top:-9px;left:38px;font-size:76px;line-height:1;font-weight:1000;color:#53ffe0;text-shadow:0 0 8px #3affd7,0 0 22px #15d9b8,-2px 3px 0 #063e3d;transform:rotate(-5deg)}.rass-word{font-size:13px;font-weight:1000;letter-spacing:2px;text-shadow:0 2px 8px #000}.status{position:fixed;z-index:490;top:calc(env(safe-area-inset-top) + 80px);left:50%;transform:translateX(-50%);max-width:calc(100vw - 28px);border-radius:30px;background:#09282adf;color:#effffb;padding:8px 14px;font-size:12px;text-align:center;box-shadow:0 4px 15px #0003;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.toast{position:fixed;z-index:650;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 148px);padding:14px 16px;border-radius:15px;background:#092b2d;color:#fff;border:1px solid #54c7b5;box-shadow:0 8px 35px #0008;display:none;text-align:center;font-weight:650}.sheet{position:fixed;z-index:700;left:0;right:0;bottom:0;background:#0c252a;color:white;border-radius:24px 24px 0 0;padding:22px 20px calc(env(safe-area-inset-bottom) + 24px);box-shadow:0 -10px 40px #0009;display:none}.sheet h2{margin:0 0 10px;font-size:22px}.sheet p{line-height:1.5;color:#c5d9da}.sheet button{width:100%;padding:15px;border:0;border-radius:13px;font-size:16px;font-weight:800;background:#42e5cc;color:#062323;margin-top:12px}.sheet .secondary{background:#29434a;color:#fff}.close{position:absolute;right:20px;top:15px;border:0;background:none;color:#fff;font-size:26px;cursor:pointer}.user-dot{width:17px;height:17px;border:3px solid white;border-radius:50%;background:#1689ff;box-shadow:0 0 0 7px #1689ff33}.hazard-dot{width:17px;height:17px;border:2px solid #fff;border-radius:50%;box-shadow:0 1px 6px #0008}.leaflet-popup-content-wrapper{border-radius:13px}.leaflet-popup-content{font:14px system-ui}
</style></head><body><div id="map" aria-label="Road hazard map"></div><div class="top"><div class="logo">RASS<span>!</span></div><div class="controls"><button class="round" id="voice" aria-label="Mute voice alerts" aria-pressed="true" title="Voice alerts on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path class="sound" d="M15 9a5 5 0 0 1 0 6M18 6a9 9 0 0 1 0 12"/></svg></button></div></div><div class="status" id="status">Connecting to road alerts…</div><button class="round locate" id="locate" aria-label="Centre map on my location" title="My location"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4"/></svg></button><div class="report-wrap"><button class="rass" id="report" aria-label="Report a road hazard"><span class="crater"></span><span class="bang">!</span></button><div class="rass-word">RASS!</div></div><div class="toast" id="toast" role="status"></div><section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><button class="close" id="close" aria-label="Close">×</button><h2 id="sheetTitle">Report a road hazard</h2><p id="sheetText">Your location is used to report a hazard for Team review.</p><button id="confirm">Continue</button><button class="secondary" id="cancel">Cancel</button></section><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
'use strict';const SB='https://hwoqolkmfyvxddyvpasm.supabase.co',KEY='sb_publishable_Xpm78JqqmovaIi6nPzrRCg_9q0NWa2Z';const $=id=>document.getElementById(id);const names={pothole:'Pothole',crater:'Crater',dig_out:'Dig Out',rock_and_roll:'Rock & Roll',squared_out:'Squared-Out',pot_bump:'Pot Bump',scrapings:'Scrapings',flood_watch:'Flood Watch',no_passage:'No Passage',bumpy_ride:'Bumpy Ride',dilly_dally:'Dilly Dally',eeny_meeny_miney_mo:'Eeny Meeny Miney Mo'};const voices={pothole:'Pothole ahead. Slow down.',crater:'Severe pothole ahead. Slow down.',dig_out:'Deep pothole ahead. Reduce speed.',rock_and_roll:'Rough stone surface ahead. Slow down.',squared_out:'Excavated road surface ahead. Slow down.',pot_bump:'Raised road patch ahead. Slow down.',scrapings:'Road surface scraped ahead. Reduce speed.',flood_watch:'Flooding reported ahead. Do not enter flooded roads.',no_passage:'Road impassable ahead. Find another route.',bumpy_ride:'Uneven road ahead. Slow down.',dilly_dally:'Multiple potholes ahead. Manoeuvre with caution.',eeny_meeny_miney_mo:'Multiple road hazards ahead. Reduce speed.'};const colors={crater:'#e94b55',dig_out:'#e97749',no_passage:'#d53f52',flood_watch:'#368be2',rock_and_roll:'#d7a252',pothole:'#f6a548',pot_bump:'#efbb63',squared_out:'#e28b51',scrapings:'#bca66a'};
const map=L.map('map',{zoomControl:false}).setView([18.0179,-76.8099],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);const pins=L.layerGroup().addTo(map);let hazards=[],pos=null,fixes=[],heading=null,headingReliable=false,watch=null,voiceOn=true,spoken=new Map(),lastToast=null;function status(s){$('status').textContent=s}function toast(s){$('toast').textContent=s;$('toast').style.display='block';clearTimeout(lastToast);lastToast=setTimeout(()=>$('toast').style.display='none',3800)}function rad(x){return x*Math.PI/180}function meters(a,b){const x=rad(b.latitude-a.latitude),y=rad(b.longitude-a.longitude);return 6371000*2*Math.asin(Math.sqrt(Math.sin(x/2)**2+Math.cos(rad(a.latitude))*Math.cos(rad(b.latitude))*Math.sin(y/2)**2))}function bearing(a,b){const d=rad(b.longitude-a.longitude),y=Math.sin(d)*Math.cos(rad(b.latitude)),x=Math.cos(rad(a.latitude))*Math.sin(rad(b.latitude))-Math.sin(rad(a.latitude))*Math.cos(rad(b.latitude))*Math.cos(d);return(Math.atan2(y,x)*180/Math.PI+360)%360}function angular(a,b){return Math.abs(((a-b+540)%360)-180)}function say(s){if(!voiceOn||!('speechSynthesis'in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.lang='en-US';u.rate=.95;speechSynthesis.speak(u)}catch(e){}}
async function feed(){try{const res=await fetch(SB+'/rest/v1/rpc/rass_get_map_hazards',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:'{}',cache:'no-store'});if(!res.ok)throw Error('Feed unavailable');const rows=await res.json();if(!Array.isArray(rows))throw Error('Unexpected feed');hazards=rows.filter(h=>h.status==='confirmed'&&h.classification!=='unclassified'&&Number.isFinite(+h.latitude)&&Number.isFinite(+h.longitude)).map(h=>({...h,latitude:+h.latitude,longitude:+h.longitude}));pins.clearLayers();hazards.forEach(h=>{const c=colors[h.classification]||'#e7a24e';L.circleMarker([h.latitude,h.longitude],{radius:8,color:'#fff',weight:2,fillColor:c,fillOpacity:1}).addTo(pins).bindPopup('<strong>'+ (names[h.classification]||'Road hazard')+'</strong>')});status(pos?'Road alerts active':'Road alerts ready · enable location')}catch(e){status('Road alerts unavailable · retrying')}}
let dot=null;function check(p){if(!hazards.length||!headingReliable||p.accuracy>20||!Number.isFinite(p.speed)||p.speed<2.2)return;const eligible=hazards.map(h=>({h,d:meters(p,h)})).filter(x=>x.d<=180&&angular(heading,bearing(p,x.h))<=38).sort((a,b)=>a.d-b.d);const lead=eligible.find(x=>Date.now()-(spoken.get(x.h.id)||0)>600000);if(!lead)return;const group=eligible.filter(x=>Math.abs(x.d-lead.d)<=105&&meters(x.h,lead.h)<=125);(group.length?group:[lead]).forEach(x=>spoken.set(x.h.id,Date.now()));const msg=group.length>1?'Multiple road hazards ahead. Slow down.':(voices[lead.h.classification]||'Road hazard ahead. Slow down.');say(msg);toast(msg)}function update(c){const p={latitude:c.latitude,longitude:c.longitude,accuracy:c.accuracy,speed:c.speed,at:Date.now()};fixes.push(p);fixes=fixes.filter(f=>p.at-f.at<=30000).slice(-30);const origin=fixes.find(f=>p.at-f.at>=4000&&f.accuracy<=30);headingReliable=false;if(origin){const d=meters(origin,p),noise=Math.max(25,origin.accuracy+p.accuracy);if(d>noise&&p.accuracy<=20){heading=bearing(origin,p);headingReliable=true}}pos=p;const ll=[p.latitude,p.longitude];if(!dot)dot=L.circleMarker(ll,{radius:9,color:'#fff',weight:3,fillColor:'#188dff',fillOpacity:1}).addTo(map);else dot.setLatLng(ll);if(!window.rassCentered){map.setView(ll,15);window.rassCentered=true}status('Road alerts active');check(p)}function startGPS(){if(!navigator.geolocation||!window.isSecureContext){status('Location requires HTTPS');return}if(watch!==null)return;status('Allow location to receive road alerts');watch=navigator.geolocation.watchPosition(e=>update(e.coords),e=>{status(e.code===1?'Location off · tap locate to enable':'Location unavailable · tap locate to retry');if(watch!==null)navigator.geolocation.clearWatch(watch);watch=null},{enableHighAccuracy:true,maximumAge:1000,timeout:15000})}
$('locate').onclick=()=>{if(pos)map.setView([pos.latitude,pos.longitude],16);else startGPS()};$('voice').onclick=()=>{voiceOn=!voiceOn;$('voice').setAttribute('aria-pressed',String(voiceOn));$('voice').title=voiceOn?'Voice alerts on':'Voice alerts off';document.querySelectorAll('.sound').forEach(e=>e.style.display=voiceOn?'':'none');if(!voiceOn)window.speechSynthesis?.cancel();toast(voiceOn?'Voice alerts on':'Voice alerts muted')};function closeSheet(){$('sheet').style.display='none'}$('close').onclick=closeSheet;$('cancel').onclick=closeSheet;$('report').onclick=()=>{$('sheet').style.display='block';$('sheetTitle').textContent='Report a road hazard';$('sheetText').textContent=pos?'Location found. Guest reporting is not yet enabled in this preview.':'Location not available yet. Guest reporting is not yet enabled in this preview.';$('confirm').textContent='OK';};$('confirm').onclick=closeSheet;
feed();startGPS();setInterval(feed,120000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)feed()});
</script></body></html>
