let userMarker;function gpsSuccess(e){const p={latitude:e.coords.latitude,longitude:e.coords.longitude,accuracy:e.coords.accuracy,speed:e.coords.speed,time:Date.now()};if(previous&&p.time-previous.time>3000&&p.accuracy<=25&&previous.accuracy<=25&&dist(previous,p)>Math.max(22,p.accuracy+previous.accuracy))heading=bearing(previous,p);if(!previous||p.time-previous.time>=4000)previous=p;position=p;hideBanner();$('status').textContent='Road alerts active';const ll=[p.latitude,p.longitude];if(!userMarker){userMarker=L.marker(ll,{icon:L.divIcon({className:'',html:'<div class="userpin"></div>',iconSize:[19,19],iconAnchor:[9,9]})}).addTo(map)}else userMarker.setLatLng(ll);if(follow){if(heading!==null&&p.speed!==null&&p.speed>2){const distanceAhead=.00065;const lat=p.latitude+distanceAhead*Math.cos(rad(heading)),lng=p.longitude+distanceAhead*Math.sin(rad(heading))/Math.cos(rad(p.latitude));map.setView([lat,lng],17,{animate:true})}else map.setView(ll,17,{animate:!!map._rassLocated});map._rassLocated=true}checkHazards(p)}
function startGPS(){hideBanner();if(!navigator.geolocation||!window.isSecureContext){$('status').textContent='Location unavailable';banner('Location needs a secure HTTPS page. Opening this file from Downloads may prevent GPS access. Upload the file to GitHub Pages for a real location test.',false);return}if(watch!==null){navigator.geolocation.clearWatch(watch);watch=null}$('status').textContent='Finding your location…';watch=navigator.geolocation.watchPosition(gpsSuccess,e=>{const msg=e.code===1?'Location permission was denied. Allow location for this website in your browser settings.':e.code===2?'Your phone could not determine its location. Check that Location is enabled.':'Location timed out. Try again outdoors or near a window.';$('status').textContent='Location not available';banner(msg,true)},{enableHighAccuracy:true,maximumAge:2000,timeout:14000})}
async function feed(){try{const r=await fetch(SB+'/rest/v1/rpc/rass_get_map_hazards',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:'{}',cache:'no-store'});if(!r.ok)throw Error('Feed unavailable');const rows=await r.json();hazards=(Array.isArray(rows)?rows:[]).filter(h=>h.status==='confirmed'&&h.classification!=='unclassified'&&Number.isFinite(+h.latitude)&&Number.isFinite(+h.longitude)).map(h=>({...h,latitude:+h.latitude,longitude:+h.longitude}));markers.clearLayers();hazards.forEach(h=>L.circleMarker([h.latitude,h.longitude],{radius:7,color:'#fff',weight:2,fillColor:colors[h.classification]||'#e6a45c',fillOpacity:1}).addTo(markers).bindPopup((h.classification||'Road hazard').replaceAll('_',' ')));}catch(e){$('status').textContent='Road alerts temporarily unavailable'}}
function checkHazards(p){if(heading===null||p.accuracy>25||p.speed===null||p.speed<2.2)return;const close=hazards.map(h=>({h,d:dist(p,h)})).filter(x=>x.d<170&&diff(heading,bearing(p,x.h))<40).sort((a,b)=>a.d-b.d);const next=close.find(x=>Date.now()-(spoken.get(x.h.id)||0)>600000);if(!next)return;spoken.set(next.h.id,Date.now());const s=voices[next.h.classification]||'Road hazard ahead. Slow down.';speak(s);showToast(s)}
$('go').onclick=()=>{$('welcome').style.display='none';setTimeout(()=>map.invalidateSize(),100);startGPS();if(!localStorage.getItem('rassCoachSeen'))setTimeout(()=>$('coach').classList.add('visible'),1100)};$('locate').onclick=()=>{follow=true;if(position){gpsSuccess({coords:position})}else startGPS()};$('audio').onclick=()=>{audio=!audio;$('audio').textContent=audio?'🔊':'🔇';$('audio').setAttribute('aria-label',audio?'Mute alerts':'Unmute alerts')};function mascotDrop(){const b=$('rass');if(b.classList.contains('sink'))return;b.classList.add('sink');setTimeout(()=>b.classList.remove('sink'),750)}function closeCoach(){localStorage.setItem('rassCoachSeen','1');$('coach').classList.remove('visible')} $('practice').onclick=()=>{mascotDrop();closeCoach();showToast('Practice complete! No report sent.')};$('coachDone').onclick=closeCoach;$('rass').onclick=()=>{mascotDrop();if($('coach').classList.contains('visible')){closeCoach();showToast('Practice complete! No report sent.');return}showToast('Report preview only · no report sent')};
if(typeof L!=='undefined'){map=L.map('map',{zoomControl:false}).setView([17.995,-76.958],16);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);markers=L.layerGroup().addTo(map);map.on('dragstart',()=>{follow=false;$('status').textContent='Map moved · tap ◎ to follow'});feed();setInterval(feed,90000)}else banner('Map library could not load. Check internet connection.',false);
</script></body></html>
